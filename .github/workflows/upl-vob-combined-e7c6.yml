name: UPL validate VOB NTSC after overwrite on e7c6

on:
  push:
    branches:
      - upl/vob-combined-e7c6-work

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: upl/vob-combined-e7c6-work
          fetch-depth: 0

      - name: Stage deterministic conflict resolver
        shell: bash
        run: cp .github/scripts/upl_resolve_vob_ntsc_after_overwrite.py "$RUNNER_TEMP/upl_resolve_vob_ntsc_after_overwrite.py"

      - name: Apply NTSC fix on top of overwrite fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git checkout --detach 2d29d0ca59e81b7a883452436220723ec8d38aa5
          git fetch origin fix/vob-ntsc-standard
          set +e
          git cherry-pick cfd5ef65f6bf8278f6e3b29bda8b076862a2184c
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            git checkout HEAD -- src/seconv/Core/SubtitleConverter.cs
            python "$RUNNER_TEMP/upl_resolve_vob_ntsc_after_overwrite.py"
            git add src/seconv/Core/SubtitleConverter.cs
            git cherry-pick --continue
          fi
          git diff --check e7c6c1f01040af867cda6251921e18cc84758f1e..HEAD

      - name: Verify combined call site
        shell: bash
        run: grep -F "VobSubExtractor.Extract(vobFiles, outputBase, options.VobIsPal, overwrite: options.Overwrite);" src/seconv/Core/SubtitleConverter.cs

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted VOB tests
        run: dotnet test tests/seconv/SeConvTests.csproj --filter VobSubExtractorTest

      - name: Full solution tests
        run: dotnet test SubtitleEdit.sln

      - name: Publish validated dependent branch
        shell: bash
        run: git push origin HEAD:fix/vob-ntsc-after-overwrite-e7c6
