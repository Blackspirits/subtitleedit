name: UPL validate VOB PAL and NTSC selection

on:
  push:
    branches:
      - upl/fix-vob-ntsc-work

permissions:
  contents: write

jobs:
  vob-ntsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vob-ntsc-standard
          fetch-depth: 0

      - name: Apply minimal VOB standard patch
        shell: bash
        run: |
          git fetch origin upl/fix-vob-ntsc-work:refs/remotes/origin/upl/fix-vob-ntsc-work
          git show refs/remotes/origin/upl/fix-vob-ntsc-work:.github/scripts/upl_vob_ntsc_patch.py > "$RUNNER_TEMP/upl_vob_ntsc_patch.py"
          git show refs/remotes/origin/upl/fix-vob-ntsc-work:.github/scripts/upl_vob_ntsc_help_patch.py > "$RUNNER_TEMP/upl_vob_ntsc_help_patch.py"
          python "$RUNNER_TEMP/upl_vob_ntsc_patch.py"
          python "$RUNNER_TEMP/upl_vob_ntsc_help_patch.py"
          expected=$'src/seconv/Commands/ConvertCommand.cs\nsrc/seconv/Core/SubtitleConverter.cs\nsrc/seconv/Helpers/HelpDisplay.cs\ntests/seconv/Core/VobSubExtractorTest.cs'
          actual="$(git diff --name-only HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted VOB regression
        run: dotnet test tests/seconv/SeConvTests.csproj --filter "VobSubExtractorTest|HelpDisplayTest"

      - name: Full solution tests with one retry
        shell: bash
        run: |
          if ! dotnet test SubtitleEdit.sln; then
            echo 'First full-suite run failed; retrying once to match the repository Tests workflow.'
            dotnet test SubtitleEdit.sln
          fi

      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/seconv/Commands/ConvertCommand.cs src/seconv/Core/SubtitleConverter.cs src/seconv/Helpers/HelpDisplay.cs tests/seconv/Core/VobSubExtractorTest.cs
          git commit -m 'Allow explicit NTSC for VOB extraction'
          git push origin HEAD:fix/vob-ntsc-standard
