name: UPL finalize remaining rc5 branches

on:
  push:
    branches:
      - upl/finalize-rc5-work

permissions:
  contents: write

jobs:
  vob-overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vob-multistream-overwrite
          fetch-depth: 0

      - name: Apply tested VOB patch
        run: |
          git fetch origin upl/fix-vob-overwrite-work:refs/remotes/origin/upl/fix-vob-overwrite-work
          git checkout refs/remotes/origin/upl/fix-vob-overwrite-work -- \
            src/seconv/Core/SubtitleConverter.cs \
            src/seconv/Core/VobSubExtractor.cs \
            tests/seconv/Core/VobSubExtractorTest.cs
          test "$(git diff --name-only HEAD | sort)" = $'src/seconv/Core/SubtitleConverter.cs\nsrc/seconv/Core/VobSubExtractor.cs\ntests/seconv/Core/VobSubExtractorTest.cs'
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted regression
        run: dotnet test tests/seconv/SeConvTests.csproj --filter VobSubExtractorTest

      - name: Full solution tests with one retry
        run: |
          if ! dotnet test SubtitleEdit.sln; then
            echo 'First full-suite run failed; retrying once to match the repository Tests workflow.'
            dotnet test SubtitleEdit.sln
          fi

      - name: Commit clean patch
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/seconv/Core/SubtitleConverter.cs src/seconv/Core/VobSubExtractor.cs tests/seconv/Core/VobSubExtractorTest.cs
          git commit -m 'Protect multi-stream VOB outputs from accidental overwrite'
          git push origin HEAD:fix/vob-multistream-overwrite

  inno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/inno-7.1.0-x64-rc5
          fetch-depth: 0

      - name: Apply verified Inno workflow patch
        run: |
          git fetch origin ci/inno-7.1.0-x64-current:refs/remotes/origin/ci/inno-7.1.0-x64-current
          git checkout refs/remotes/origin/ci/inno-7.1.0-x64-current -- .github/workflows/build-ui.yml
          test "$(git diff --name-only HEAD)" = '.github/workflows/build-ui.yml'
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Full solution tests with one retry
        run: |
          if ! dotnet test SubtitleEdit.sln; then
            echo 'First full-suite run failed; retrying once to match the repository Tests workflow.'
            dotnet test SubtitleEdit.sln
          fi

  inno-smoke:
    needs: inno-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/inno-7.1.0-x64-rc5
          fetch-depth: 0

      - name: Apply verified Inno workflow patch
        shell: pwsh
        run: |
          git fetch origin "ci/inno-7.1.0-x64-current:refs/remotes/origin/ci/inno-7.1.0-x64-current"
          git checkout "refs/remotes/origin/ci/inno-7.1.0-x64-current" -- .github/workflows/build-ui.yml
          $changed = (git diff --name-only HEAD).Trim()
          if ($changed -ne '.github/workflows/build-ui.yml') { throw "Unexpected changed files: $changed" }
          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/ui/UI.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=none `
            -o ./src/ui/bin/Release/net10.0/publish
          New-Item -ItemType File -Force ./src/ui/bin/Release/net10.0/publish/libmpv-2.dll | Out-Null

      - name: Install verified Inno Setup 7.1.0 x64
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'installer\WindowsInno\Subtitle_Edit_Installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem 'installer\WindowsInno\SubtitleEdit-*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer compile succeeded without producing a setup executable' }
          Write-Host "Compiled successfully: $($setup.Name)"

      - name: Commit clean workflow patch
        shell: pwsh
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add .github/workflows/build-ui.yml
          git commit -m 'Use verified Inno Setup 7.1.0 x64 in release build'
          git push origin HEAD:ci/inno-7.1.0-x64-rc5
