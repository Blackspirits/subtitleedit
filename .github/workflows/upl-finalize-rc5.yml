name: UPL finalize rc5 branches

on:
  push:
    branches:
      - upl/finalize-rc5-work

permissions:
  contents: write

jobs:
  ytdlp-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ytdlp-part-checksum
          fetch-depth: 0

      - name: Apply tested yt-dlp patch
        run: |
          git fetch origin upl/fix-ytdlp-checksum-work:refs/remotes/origin/upl/fix-ytdlp-checksum-work
          git checkout refs/remotes/origin/upl/fix-ytdlp-checksum-work -- \
            src/ui/Logic/Download/YtDlpDownloadService.cs \
            tests/UI/Logic/Download/YtDlpDownloadServiceTests.cs
          test "$(git diff --name-only HEAD | sort)" = $'src/ui/Logic/Download/YtDlpDownloadService.cs\ntests/UI/Logic/Download/YtDlpDownloadServiceTests.cs'
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted regression
        run: dotnet test tests/UI/UITests.csproj --filter YtDlpDownloadServiceTests

      - name: Full solution tests
        run: dotnet test SubtitleEdit.sln

      - name: Commit clean patch
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/ui/Logic/Download/YtDlpDownloadService.cs tests/UI/Logic/Download/YtDlpDownloadServiceTests.cs
          git commit -m 'Verify yt-dlp temporary downloads before install'
          git push origin HEAD:fix/ytdlp-part-checksum

  vob-overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vob-multistream-overwrite
          fetch-depth: 0

      - name: Apply tested VOB patch
        run: |
          git fetch origin upl/fix-vob-overwrite-work:refs/remotes/origin/upl/fix-vob-overwrite-work
          git checkout refs/remotes/origin/upl/fix-vob-overwrite-work -- \
            src/seconv/Core/SubtitleConverter.cs \
            src/seconv/Core/VobSubExtractor.cs \
            tests/seconv/Core/VobSubExtractorTest.cs
          test "$(git diff --name-only HEAD | sort)" = $'src/seconv/Core/SubtitleConverter.cs\nsrc/seconv/Core/VobSubExtractor.cs\ntests/seconv/Core/VobSubExtractorTest.cs'
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted regression
        run: dotnet test tests/seconv/SeConvTests.csproj --filter VobSubExtractorTest

      - name: Full solution tests
        run: dotnet test SubtitleEdit.sln

      - name: Commit clean patch
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/seconv/Core/SubtitleConverter.cs src/seconv/Core/VobSubExtractor.cs tests/seconv/Core/VobSubExtractorTest.cs
          git commit -m 'Protect multi-stream VOB outputs from accidental overwrite'
          git push origin HEAD:fix/vob-multistream-overwrite

  pt-pt-rc5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: translation/pt-pt-5.2.0-rc5
          fetch-depth: 0

      - name: Apply rc4 translation to rc5 baseline
        run: |
          git fetch origin translation/pt-pt-5.2.0-rc4:refs/remotes/origin/translation/pt-pt-5.2.0-rc4
          git checkout refs/remotes/origin/translation/pt-pt-5.2.0-rc4 -- src/ui/Assets/Languages/Portuguese.json
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui/Assets/Languages/Portuguese.json')
          s = p.read_text(encoding='utf-8-sig')
          old = '"version": "v5.2.0-rc4"'
          new = '"version": "v5.2.0-rc5"'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          test "$(git diff --name-only HEAD)" = 'src/ui/Assets/Languages/Portuguese.json'
          git diff --check HEAD

      - name: Translation structural QA
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          def load(path):
              seen_dupes = []
              def hook(pairs):
                  out = {}
                  for k, v in pairs:
                      if k in out:
                          seen_dupes.append(k)
                      out[k] = v
                  return out
              data = json.loads(Path(path).read_text(encoding='utf-8-sig'), object_pairs_hook=hook)
              assert not seen_dupes, f'duplicate keys in {path}: {seen_dupes[:20]}'
              return data

          def flatten(obj, prefix=()):
              out = {}
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      out.update(flatten(v, prefix + (k,)))
              else:
                  out[prefix] = obj
              return out

          placeholder = re.compile(r'\{(\d+)(?:,[^}:]+)?(?::[^}]+)?\}')
          en = flatten(load('src/ui/Assets/Languages/English.json'))
          pt = flatten(load('src/ui/Assets/Languages/Portuguese.json'))
          assert set(en) == set(pt), f'key mismatch: missing={sorted(set(en)-set(pt))[:20]} extra={sorted(set(pt)-set(en))[:20]}'
          for key, en_value in en.items():
              pt_value = pt[key]
              if isinstance(en_value, str) and isinstance(pt_value, str):
                  a = sorted(placeholder.findall(en_value))
                  b = sorted(placeholder.findall(pt_value))
                  assert a == b, f'placeholder mismatch at {".".join(key)}: {a} != {b}'
          assert pt[('version',)] == 'v5.2.0-rc5'
          assert pt[('cultureName',)] == 'pt-PT'
          print(f'QA OK: {len(en)} leaf values; keys/placeholders/version/culture match')
          PY

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Full solution tests
        run: dotnet test SubtitleEdit.sln

      - name: Commit clean translation
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/ui/Assets/Languages/Portuguese.json
          git commit -m 'Update Portuguese translation for 5.2.0-rc5'
          git push origin HEAD:translation/pt-pt-5.2.0-rc5

  inno-rc5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/inno-7.1.0-x64-rc5
          fetch-depth: 0

      - name: Apply verified Inno workflow patch
        shell: pwsh
        run: |
          git fetch origin "ci/inno-7.1.0-x64-current:refs/remotes/origin/ci/inno-7.1.0-x64-current"
          git checkout "refs/remotes/origin/ci/inno-7.1.0-x64-current" -- .github/workflows/build-ui.yml
          $changed = (git diff --name-only HEAD).Trim()
          if ($changed -ne '.github/workflows/build-ui.yml') { throw "Unexpected changed files: $changed" }
          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Full solution tests
        shell: pwsh
        run: dotnet test SubtitleEdit.sln

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/ui/UI.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=none `
            -o ./src/ui/bin/Release/net10.0/publish
          New-Item -ItemType File -Force ./src/ui/bin/Release/net10.0/publish/libmpv-2.dll | Out-Null

      - name: Install verified Inno Setup 7.1.0 x64
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'installer\WindowsInno\Subtitle_Edit_Installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem 'installer\WindowsInno\SubtitleEdit-*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer compile succeeded without producing a setup executable' }
          Write-Host "Compiled successfully: $($setup.Name)"

      - name: Commit clean workflow patch
        shell: pwsh
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add .github/workflows/build-ui.yml
          git commit -m 'Use verified Inno Setup 7.1.0 x64 in release build'
          git push origin HEAD:ci/inno-7.1.0-x64-rc5
