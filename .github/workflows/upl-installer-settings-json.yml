name: UPL validate installer Settings.json reset

on:
  push:
    branches:
      - upl/fix-installer-settings-work

permissions:
  contents: write

jobs:
  installer-settings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/installer-settings-json-reset
          fetch-depth: 0

      - name: Apply minimal installer settings patch
        shell: pwsh
        run: |
          $path = 'installer/WindowsInno/Subtitle_Edit_Installer.iss'
          $text = Get-Content $path -Raw -Encoding UTF8

          $oldDelete = 'Type: files; Name: {userappdata}\Subtitle Edit\Settings.xml; Tasks: reset_settings'
          $newDelete = @'
Type: files; Name: {userappdata}\Subtitle Edit\Settings.json; Tasks: reset_settings
Type: files; Name: {userappdata}\Subtitle Edit\Settings.xml;  Tasks: reset_settings
'@.Trim()
          if (($text.Split($oldDelete).Count - 1) -ne 1) { throw 'Unexpected Settings.xml reset anchor count' }
          $text = $text.Replace($oldDelete, $newDelete)

          $oldExist = @'
function SettingsExist(): Boolean;
begin
  Result := FileExists(ExpandConstant('{userappdata}\Subtitle Edit\Settings.xml'));
end;
'@
          $newExist = @'
function SettingsExist(): Boolean;
begin
  Result :=
    FileExists(ExpandConstant('{userappdata}\Subtitle Edit\Settings.json')) or
    FileExists(ExpandConstant('{userappdata}\Subtitle Edit\Settings.xml'));
end;
'@
          if (($text.Split($oldExist).Count - 1) -ne 1) { throw 'Unexpected SettingsExist anchor count' }
          $text = $text.Replace($oldExist, $newExist)
          Set-Content $path -Value $text -Encoding UTF8 -NoNewline

          $changed = (git diff --name-only HEAD).Trim()
          if ($changed -ne $path) { throw "Unexpected changed files: $changed" }
          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Structural regression assertions
        shell: pwsh
        run: |
          $text = Get-Content 'installer/WindowsInno/Subtitle_Edit_Installer.iss' -Raw
          if ($text -notmatch [regex]::Escape('Name: {userappdata}\Subtitle Edit\Settings.json; Tasks: reset_settings')) { throw 'Reset task does not delete Settings.json' }
          if ($text -notmatch [regex]::Escape("FileExists(ExpandConstant('{userappdata}\Subtitle Edit\Settings.json')) or")) { throw 'SettingsExist does not detect Settings.json' }
          if ($text -notmatch [regex]::Escape("FileExists(ExpandConstant('{userappdata}\Subtitle Edit\Settings.xml'))")) { throw 'Legacy Settings.xml compatibility was lost' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/ui/UI.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=none `
            -o ./src/ui/bin/Release/net10.0/publish
          New-Item -ItemType File -Force ./src/ui/bin/Release/net10.0/publish/libmpv-2.dll | Out-Null

      - name: Install verified Inno Setup 7.1.0 x64
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualSha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Inno Setup SHA-256 mismatch: expected $expectedSha256, got $actualSha256" }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'installer\WindowsInno\Subtitle_Edit_Installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem 'installer\WindowsInno\SubtitleEdit-*-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer compile succeeded without producing a setup executable' }
          Write-Host "Compiled successfully: $($setup.Name)"

      - name: Commit clean patch
        shell: pwsh
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add installer/WindowsInno/Subtitle_Edit_Installer.iss
          git commit -m 'Reset current Settings.json from installer'
          git push origin HEAD:fix/installer-settings-json-reset
