name: UPL VOB overwrite regression

on:
  push:
    branches:
      - upl/fix-vob-overwrite-work

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vob-multistream-overwrite-current
          fetch-depth: 0

      - name: Apply minimal overwrite fix and regression
        run: |
          git fetch origin upl/fix-vob-overwrite-work:refs/remotes/origin/upl/fix-vob-overwrite-work
          git show refs/remotes/origin/upl/fix-vob-overwrite-work:.github/scripts/upl_vob_overwrite_patch.py > "$RUNNER_TEMP/upl_vob_overwrite_patch.py"
          python "$RUNNER_TEMP/upl_vob_overwrite_patch.py"
          expected=$'src/seconv/Core/SubtitleConverter.cs\nsrc/seconv/Core/VobSubExtractor.cs\ntests/seconv/Core/VobSubExtractorTest.cs'
          actual="$(git diff --name-only HEAD | sort)"
          test "$actual" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$actual"; exit 1; }
          git diff --check HEAD

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Targeted regression tests
        run: dotnet test tests/seconv/SeConvTests.csproj --filter VobSubExtractorTest

      - name: Full solution tests
        run: dotnet test SubtitleEdit.sln

      - name: Publish tested patch commit
        run: |
          git config user.name 'BlackSpirits'
          git config user.email 'blackspirits@gmail.com'
          git add src/seconv/Core/VobSubExtractor.cs src/seconv/Core/SubtitleConverter.cs tests/seconv/Core/VobSubExtractorTest.cs
          git commit -m 'Protect multi-stream VOB outputs from accidental overwrite'
          git push origin HEAD:fix/vob-multistream-overwrite-current
