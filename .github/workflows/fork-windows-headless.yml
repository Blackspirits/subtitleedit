name: Fork-only Windows headless regressions

# This workflow exists only in the CI-validation branch. It is not part of any
# proposed upstream change and must not be merged.
on:
  pull_request:

jobs:
  windows:
    name: windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            project: tests/UI/UITests.csproj
            filter: "FullyQualifiedName~UITests.Logic.PluginInstallationSafetyTests|FullyQualifiedName~UITests.Logic.PopupScrollbarThemeTests|FullyQualifiedName~UITests.Logic.EditorChromePaletteTests|FullyQualifiedName~UITests.Features.Main.EditSectionButtonPanelHeightTests"
          - name: seconv
            project: tests/seconv/SeConvTests.csproj
            filter: "FullyQualifiedName~SeConvTests.Core.AtomicFileWriterTest"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: bash
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        shell: bash
        run: dotnet build "${{ matrix.project }}" --no-restore
      - name: Focused Windows tests
        shell: bash
        run: dotnet test "${{ matrix.project }}" --no-build --filter "${{ matrix.filter }}" --logger "console;verbosity=normal"
